<!doctype html>
<html lang="ja">
  <head>
    {{head}}
  </head>
  <body>
    {{header}}
    <main id="main" class="article-main">
      <div class="wrap">
        <nav class="breadcrumb" aria-label="現在位置">
          <a href="../index.html">ホーム</a><span aria-hidden="true">/</span
          ><a href="../blog.html">ブログ</a><span aria-hidden="true">/</span
          ><span>記事</span>
        </nav>
      </div>
      <article class="article-wrap">
        <header class="article-heading">
          <p class="eyebrow">{{category}}</p>
          <h1>{{title}}</h1>
          <div class="article-meta">
            <time datetime="{{date}}">{{formatted_date}}</time
            ><span>{{author}}</span><span>{{read_time}}分で読めます</span>
          </div>
          {{sample_notice}}
        </header>
        <div class="article-art {{art_class}}" aria-hidden="true">{{art}}</div>
        <div class="article-body">{{body}}</div>
        <footer class="article-footer">
          <span>TOYAMA UNIVERSITY ICE HOCKEY CLUB</span
          ><a class="text-link" href="../blog.html"
            >記事一覧へ戻る <span aria-hidden="true">↗</span></a
          >
        </footer>
      </article>
      <section class="wrap related-section" aria-labelledby="related-title">
        <div class="section-heading">
          <h2 id="related-title">こちらの記事も。</h2>
          <a class="text-link" href="../blog.html"
            >すべての記事 <span aria-hidden="true">↗</span></a
          >
        </div>
        <div class="post-grid">{{related_posts}}</div>
      </section>
    </main>
    {{footer}}
    <script src="../js/site.js" defer></script>
  </body>
</html>
