<!doctype html>
<html lang="ja">
  <head>
    {{head}}
  </head>
  <body>
    {{header}}
    <main id="main">
      <section class="journal-hero">
        <div class="wrap">
          <p class="eyebrow light">THE CLUB JOURNAL</p>
          <div class="journal-heading">
            <h1>氷上のこと。<br />日々のこと。</h1>
            <span aria-hidden="true">JOURNAL.</span>
          </div>
          <p>
            練習のこと、仲間のこと、はじめての挑戦。<br />部員の視点と、ホッケーを楽しむヒントをお届けします。
          </p>
        </div>
      </section>
      <section class="section wrap journal-list" aria-labelledby="list-title">
        <h2 id="list-title" class="sr-only">ブログ記事一覧</h2>
        <div class="blog-tools" id="blog-tools" hidden>
          <form class="search-form" role="search">
            <label class="sr-only" for="post-search"
              >タイトル・本文・著者から記事を探す</label
            ><svg viewBox="0 0 24 24" aria-hidden="true">
              <circle cx="10" cy="10" r="6" />
              <path d="m15 15 5 5" /></svg
            ><input
              id="post-search"
              type="search"
              placeholder="記事を探す"
              autocomplete="off"
              maxlength="200"
            /><button type="submit">検索</button>
          </form>
          <fieldset class="category-filters">
            <legend class="sr-only">記事のカテゴリー</legend>
            {{filters}}
          </fieldset>
        </div>
        <div class="list-meta">
          <p id="result-count" role="status" aria-live="polite">
            {{post_count}}件の記事
          </p>
          <span>NEWEST FIRST</span>
        </div>
        <div class="post-grid blog-grid" id="blog-posts">{{all_posts}}</div>
        <div class="empty-state" id="empty-state" hidden>
          <span aria-hidden="true">∅</span>
          <h3>記事が見つかりませんでした。</h3>
          <p>別の言葉で検索するか、カテゴリーを変更してみてください。</p>
          <button class="button button-dark" id="clear-filters" type="button">
            条件をリセット
          </button>
        </div>
        <noscript
          ><p class="noscript-note">
            すべての記事を表示しています。検索・カテゴリーの絞り込みにはJavaScriptを有効にしてください。
          </p></noscript
        >
      </section>
      <section class="journal-cta wrap">
        <p>読むだけでは、分からない楽しさもある。</p>
        <a class="text-link" href="index.html#recruit"
          >見学・体験について <span aria-hidden="true">↗</span></a
        >
      </section>
    </main>
    {{footer}}
    <script src="js/site.js" defer></script>
  </body>
</html>
